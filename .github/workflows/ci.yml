name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest

  lint-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: cfn-lint
      - run: checkov --config-file .checkov.yaml

  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Hermetic: the live SCF test only runs when SCF_LIVE=1 (scf-refresh workflow).
      - run: npm run scf:test

  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Catalog/spec/filesystem consistency, vendored-runtime sync, and
      # generated-artifact drift (crosswalk KSI blocks, coverage matrix, OSCAL,
      # assessment procedures, risk register, operator walkthroughs, learning hub). Offline.
      - run: npm run grc:check

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA and Conftest
        run: |
          curl -fsSL -o /tmp/opa "https://github.com/open-policy-agent/opa/releases/download/v1.8.0/opa_linux_amd64_static"
          echo "1359b1bff233fc0a290066e864c75b8158e52756319757b6854df467fe7fc146  /tmp/opa" | sha256sum -c -
          install -m 0755 /tmp/opa /usr/local/bin/opa
          curl -fsSL -o /tmp/conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz"
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  /tmp/conftest.tar.gz" | sha256sum -c -
          tar -C /usr/local/bin -xzf /tmp/conftest.tar.gz conftest
          opa version
          conftest --version
      # Labs 16 and 17 policies are not in the default `main` namespace.
      # This gate fails when Conftest reports 0 tests.
      - run: bash scripts/policy-gate.sh
