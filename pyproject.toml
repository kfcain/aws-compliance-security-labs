[project]
name = "aws-compliance-security-labs"
version = "2.1.0"
description = "AWS compliance & security labs — tooling configuration (handlers are deployed per-lab, not packaged from here)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["labs/*/index.html", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit
]
ignore = [
    "E501", # line length is advisory; handlers favor readable literals
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and construct fixed test data.
"**/tests/*" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["lab_common"]

[tool.pytest.ini_options]
testpaths = ["labs", "shared", "tests"]
addopts = "--import-mode=importlib -q"
python_files = ["test_*.py"]
