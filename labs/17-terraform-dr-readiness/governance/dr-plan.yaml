# DR plan / ODP register — lab 17 example.
#
# Approved governance artifact the assurance case references. The RTO/RPO
# targets here drive RTO_TARGET_MINUTES / RPO_TARGET_MINUTES on the function.
# Replace values and approvals with your organization's real DR plan.
system_id: grc-cloud-lab
version: "1.0"
effective_date: "2026-08-02"
approved_by: "System Owner and Business Continuity Lead"
recovery:
  primary_region: us-east-1
  recovery_region: us-west-2
  strategy: "Warm standby; reconstitute from IaC + cross-region data"
objectives:
  rto_target_minutes: 60
  rpo_target_minutes: 15
parameters:
  - requirement: "03.06.01"
    assessment_id: "A.03.06.01.ODP[01]"
    value: "Annually and after significant change"
    authority: "Contingency Planning Standard CP-01"
    notes: "DR plan review cadence."
  - requirement: "03.06.01"
    assessment_id: "A.03.06.01.ODP[02]"
    value: "All stores tagged data_classification=CUI or availability=mission-critical"
    authority: "Business Continuity Standard BCD-02"
    notes: "Critical-asset scope for DR."
  - requirement: "03.06.02"
    assessment_id: "A.03.06.02.ODP[01]"
    value: "RTO 60 minutes via warm standby + Route53 health-checked failover"
    authority: "Disaster Recovery Standard DR-01"
  - requirement: "03.08.09"
    assessment_id: "A.03.08.09.ODP[01]"
    value: >
      Cross-region durability for all critical stores: S3 replication,
      DynamoDB global tables or PITR + cross-region backup; RPO 15 minutes.
    authority: "Data Backup Standard BKP-01"
  - requirement: "03.04.01"
    assessment_id: "A.03.04.01.ODP[01]"
    value: >
      Terraform state in a remote, versioned, KMS-encrypted, cross-region
      replicated S3 backend with DynamoDB locking.
    authority: "Configuration Management Standard CM-01"
